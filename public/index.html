<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudo BTS Compress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --line:#d9dee4; --fg:#16202b; --muted:#5b6876;
  --accent:#0b7a75; --accent-soft:#dff1ef; --signal:#c2410c;
  --ok:#15803d; --ok-bg:#dcfce7; --warn:#b45309; --warn-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2;
  --display:"Chakra Petch",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --head:#f7f9fa; --zebra:#fafbfc; --hover:#eef6f5;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1419; --surface:#141d24; --line:#26333d; --fg:#e4eaef; --muted:#8c9aa6;
  --accent:#3fc1b8; --accent-soft:#16312f; --signal:#fb923c;
  --ok:#4ade80; --ok-bg:#12301d; --warn:#fbbf24; --warn-bg:#33270c; --bad:#f87171; --bad-bg:#3a1414; --head:#18232b; --zebra:#121a20; --hover:#17302f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1419; --surface:#141d24; --line:#26333d; --fg:#e4eaef; --muted:#8c9aa6;
  --accent:#3fc1b8; --accent-soft:#16312f; --signal:#fb923c;
  --ok:#4ade80; --ok-bg:#12301d; --warn:#fbbf24; --warn-bg:#33270c; --bad:#f87171; --bad-bg:#3a1414; --head:#18232b; --zebra:#121a20; --hover:#17302f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px 24px;padding-block:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;color:var(--fg);text-decoration:none}
.logo svg{width:26px;height:26px;color:var(--accent)}
.logo small{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0}
.spacer{flex:1}
.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 14px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.on{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.login{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-block:10px;border-top:1px solid var(--line);font-size:14px}
.login input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;flex:0 1 260px}
.login .msg{color:var(--warn)}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-block:14px;scrollbar-width:thin}
.tab{flex:0 0 auto;font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}

.hero{padding-block:16px 4px;display:grid;gap:6px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--signal)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1.15;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:70ch}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding-block:16px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:4px}
.card .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card .v{font-family:var(--display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.card .v small{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
.card .s{font-size:13px;color:var(--muted)}
.card.good .v{color:var(--ok)} .card.warn .v{color:var(--warn)} .card.bad .v{color:var(--bad)}

.usage{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-block:8px;display:grid;gap:10px}
.usage-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.usage-head b{color:var(--fg);font-weight:600}
.track{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.track span{height:100%;border-right:1px solid var(--surface)}
.track span.free{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 7px);border-right:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-block:12px}
.tools input{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;flex:1 1 220px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:14px;border:0;background:var(--surface);color:var(--muted);padding:8px 14px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.count{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}

/* Tabelas: cabeçalho e 1ª coluna fixos, coluna de taxa fixa à direita, zebra e barras de participação */
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:72vh;margin-bottom:12px;position:relative}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th{position:sticky;top:0;z-index:2;background:var(--head);text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
table.grouped thead tr.cols th{top:31px}
tr.groups th{height:31px;padding:6px 12px;font-size:10.5px;letter-spacing:.1em;color:var(--fg);border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:center;background:var(--head)}
tr.groups th:first-child{border-left:0;text-align:left}
th.gs,td.gs{border-left:1px solid var(--line)}
th.r,td.r{text-align:right}
th button{all:unset;display:block;padding:10px 12px;cursor:pointer;box-sizing:border-box;width:100%}
th.r button{text-align:right}
th button:hover{color:var(--fg)}
th button .arw{color:var(--accent)}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr:hover td{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
tfoot td{position:sticky;bottom:0;z-index:2;font-weight:600;border-top:1px solid var(--line);border-bottom:0;background:var(--head)}
th:first-child,td:first-child{position:sticky;left:0;z-index:1;box-shadow:inset -1px 0 0 var(--line)}
th:first-child,tfoot td:first-child{z-index:3}
th.stick-r,td.stick-r{position:sticky;right:0;z-index:1;box-shadow:inset 1px 0 0 var(--line)}
th.stick-r,tfoot td.stick-r{z-index:3}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
td.nil{color:var(--line)}
.svc small{display:block;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted);line-height:1.2}
.brv{display:inline-flex;align-items:center;gap:10px;justify-content:flex-end}
.mt{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--bg);overflow:hidden;flex:0 0 auto}
.mt i{display:block;height:100%;border-radius:3px}
.pc{font-size:11px;color:var(--muted);min-width:3.6em;text-align:right}
td.equip{min-width:170px;white-space:normal}
.eq{display:inline-block;font-size:13px;font-weight:500;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.ph{font-size:13px;color:var(--warn);font-weight:500}
.eqm{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
td.tx{white-space:normal;min-width:120px}
td.nm{cursor:pointer}
td.nm .pen{font-size:12px;color:var(--warn);font-weight:400}
td.nm:hover .pen{color:var(--accent)}
.btn.sm{font-size:12.5px;padding:4px 10px}
.btn.danger{color:var(--bad);border-color:var(--bad-bg)}
.btn.danger[data-armed="1"]{background:var(--bad);border-color:var(--bad);color:#fff}
.addbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;background:var(--surface);border:1px dashed var(--accent);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.addbar .ttl{flex-basis:100%;font-weight:600;font-size:14px;color:var(--accent)}
.addbar label{display:grid;gap:4px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);flex:0 1 160px;min-width:0}
.addbar label.grow{flex:1 1 220px}
.addbar input,.addbar select{font:inherit;font-size:14px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
.addbar .msg{color:var(--bad);font-size:13px;align-self:center}
.addbar .empty-pick{font-size:13px;color:var(--muted);align-self:center}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px;grid-column:1/-1}
.eqgrid .checks label{display:flex;flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:14px;font-weight:400;color:var(--fg);cursor:pointer}
.eqgrid .checks input{width:auto;accent-color:var(--accent)}
.eqform{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 16px 16px;margin-bottom:16px}
.eqform h2{margin:14px 0 12px}
.eqgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.eqgrid label{display:grid;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.eqgrid input{font:inherit;font-size:14px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.eqgrid .wide{grid-column:1/-1}
.eqactions{display:flex;gap:12px;align-items:center;margin-top:14px}
.eqactions .msg{color:var(--bad);font-size:14px}
select.cell.text{font:inherit;font-size:13.5px;color:var(--fg);background:var(--bg);border:1px solid var(--accent);border-radius:4px;padding:4px 6px;width:100%;min-width:180px}
td input.cell.text{width:100%;min-width:160px;text-align:left;font-family:var(--body)}
.dl{display:inline-block;font-family:var(--mono);font-size:12.5px;padding:1px 8px;border-radius:999px}
.dl.up{background:var(--bad-bg);color:var(--bad)} .dl.down{background:var(--ok-bg);color:var(--ok)} .dl.eq{color:var(--muted)}
td.ed{cursor:pointer;box-shadow:inset 0 -2px 0 var(--warn-bg)}
td.ed:hover{background:var(--warn-bg)}
td.saved{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--ok-bg)}to{background:transparent}}
td input.cell{width:7em;font:inherit;font-family:var(--mono);color:var(--fg);background:var(--bg);border:1px solid var(--accent);border-radius:4px;padding:3px 6px;text-align:right}
.svc{display:flex;align-items:center;gap:10px;font-weight:600}
.dot{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;font-family:var(--body)}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-acc{background:var(--accent-soft);color:var(--accent)}
.up{color:var(--bad)} .down{color:var(--ok)}
.empty{padding:32px;text-align:center;color:var(--muted)}
.editbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:0 0 12px;font-size:14px;color:var(--muted)}
.notes{display:grid;gap:8px;padding-block:4px 32px}
.notes p{margin:0;font-size:13px;color:var(--muted);max-width:90ch}
.notes p.flag{color:var(--warn)}
h2{font-family:var(--display);font-size:20px;font-weight:600;margin:20px 0 10px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}
.state{padding:48px 0;text-align:center;color:var(--muted)}
footer{border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{padding-block:20px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;color:var(--muted);font-size:13px}
@media (max-width:640px){.count{margin-left:0;flex-basis:100%}}
@media (prefers-reduced-motion:reduce){td.saved{animation:none}}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="logo" href="/">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 26h24" stroke="currentColor" stroke-width="2"/><path d="M16 26V12M10 26l6-14 6 14" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8a10 10 0 0 1 14 0M12 11a5 5 0 0 1 8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      BTS Compress <small>estudo 03/08/2026</small>
    </a>
    <span class="spacer"></span>
    <button class="btn" id="editBtn" type="button" hidden>Editar valores</button>
    <button class="btn" id="themeBtn" type="button">Tema</button>
  </div>
  <form class="wrap login" id="login" hidden>
    <label for="token">Senha de edição</label>
    <input id="token" type="password" autocomplete="current-password" placeholder="ADMIN_TOKEN do servidor">
    <button class="btn primary" type="submit">Entrar</button>
    <button class="btn" type="button" id="loginCancel">Cancelar</button>
    <span class="msg" id="loginMsg"></span>
  </form>
</header>

<main>
  <div class="wrap">
    <div class="tabs" id="tabs" role="tablist" aria-label="Estudos"></div>
    <div id="app"><p class="state">Carregando dados do banco…</p></div>
  </div>
</main>

<footer><div class="wrap"><span>Dados: estudo_completo_BTS - 03_08_2026.xlsx · PostgreSQL</span><span>Taxas em Mbps, exceto onde indicado</span></div></footer>

<script>
const HUES=["#0b7a75","#c2410c","#4338ca","#be185d","#15803d","#b45309","#0369a1","#7c3aed","#0f766e","#9f1239","#4d7c0f","#1d4ed8","#a16207","#6d28d9"];
const $=id=>document.getElementById(id);
const nf=new Intl.NumberFormat("pt-BR",{maximumFractionDigits:4});
const fmt=v=>v==null?"—":typeof v==="number"?nf.format(v):v;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const r3=v=>+(+v).toFixed(4);
const sumBy=(a,k)=>r3(a.reduce((s,r)=>s+(r[k]||0),0));
const colorMap={};let ci=0;
const col=name=>{const k=name.replace(/[^A-Z0-9]/gi,"").toUpperCase().replace(/^TV/,"").replace(/1SEG$|1S$/,"1S");return colorMap[k]??=HUES[ci++%HUES.length]};
const svcCell=n=>`<span class="svc"><span class="dot" style="background:${col(n)}"></span>${esc(n)}</span>`;
const delta=d=>d==null?"—":d===0?"0":`<span class="${d>0?"up":"down"}">${d>0?"+":""}${nf.format(d)}</span>`;
const pct=(a,b)=>nf.format(r3(a/b*100).toFixed(1)*1);
const card=(k,v,unit,s,cls="")=>`<div class="card ${cls}"><span class="k">${k}</span><span class="v">${v}<small>${unit||""}</small></span>${s?`<span class="s">${s}</span>`:""}</div>`;
function getToken(){try{return localStorage.getItem("bts_token")||""}catch{return ""}}
function setToken(t){try{t?localStorage.setItem("bts_token",t):localStorage.removeItem("bts_token")}catch{}}
function toast(msg,err){const t=document.createElement("div");t.className="toast"+(err?" err":"");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

function usageBar(title,items,total){
  const used=items.reduce((s,i)=>s+(i.v||0),0),free=Math.max(0,total-used),over=used>total;
  return `<div class="usage"><div class="usage-head"><span><b>${title}</b></span><span>${nf.format(r3(used))} de ${nf.format(total)} Mbps · ${pct(used,total)}% ocupado${over?' · <b style="color:var(--bad)">acima da capacidade</b>':""}</span></div>
  <div class="track" role="img" aria-label="${title}">${items.map(i=>`<span title="${esc(i.n)}: ${nf.format(i.v||0)} Mbps" style="width:${Math.min(100,(i.v||0)/Math.max(total,used)*100)}%;background:${col(i.n)}"></span>`).join("")}<span class="free" title="Livre: ${nf.format(r3(free))} Mbps" style="width:${free/Math.max(total,used)*100}%"></span></div>
  <div class="legend">${items.filter(i=>i.v>0).map(i=>`<span><i style="background:${col(i.n)}"></i>${esc(i.n)} ${nf.format(i.v)}</span>`).join("")}<span><i style="background:var(--line)"></i>Livre ${nf.format(r3(free))}</span></div></div>`;
}
function freeCard(label,free,cls){return card(label,nf.format(r3(free)),"Mbps",free<0?"Capacidade excedida":"",free<0?"bad":cls)}

/* ===== Estado ===== */
let D=null,view="pids",taxMode="enc",sorts={},editing=false,canEdit=false,auditLog=[];
const S=k=>D.settings.find(s=>s.key===k)?.value;
const ref=(t,id,f,ctx)=>({t,id,f,ctx});

function svcNameRef(s){return {...ref("services",s.id,"name",`Serviço ${s.name} · nome`),kind:"text",renameSvc:1}}
function build(){
  const svc=Object.fromEntries(D.services.map(s=>[s.id,s]));
  const br=cfg=>D.bitrates.filter(b=>b.config===cfg);
  const pidsRows=D.pids.map(p=>{const s=svc[p.service_id],b=br("pids_total").find(x=>x.service_id===p.service_id);
    const row={id:s.service_id,svc:s.name,cod:s.codec,br:b?.mbps??null,note:b?.note,_ref:{}};
    for(const k of["v","a1","a2","a3","a4","pcr","pmt","dem","ait","cc","ect","data"]){row[k]=p[k];row._ref[k]=ref("service_pids",p.service_id,k,`${s.name} · PID ${k}`)}
    if(b)row._ref.br=ref("bitrates",b.id,"mbps",`${s.name} · PIDs total`);
    row._del=[["service_pids",p.service_id],...(b?[["bitrates",b.id]]:[])];row._name=s.name;row._ref.svc=svcNameRef(s);return row});
  const tit=br("titular"),res=br("reserva"),old=br("antigo");
  const nowIds=D.services.filter(s=>tit.some(x=>x.service_id===s.id)||res.some(x=>x.service_id===s.id)).map(s=>s.id);
  const nowRows=nowIds.map(sid=>{const s=svc[sid],t=tit.find(x=>x.service_id===sid),r=res.find(x=>x.service_id===sid);
    return {id:s.service_id,svc:s.name,encT:t?.equipment_id??null,tit:t?.mbps??null,encR:r?.equipment_id??null,res:r?.mbps??null,d:t&&r&&t.mbps!=null&&r.mbps!=null?r3(r.mbps-t.mbps):null,
      _txt:[eqLabel(t?.equipment_id),eqLabel(r?.equipment_id)].join(" "),_name:s.name,_del:[...(t?[["bitrates",t.id]]:[]),...(r?[["bitrates",r.id]]:[])],
      _ref:{svc:svcNameRef(s),...(t?{tit:ref("bitrates",t.id,"mbps",`${s.name} · titular`),encT:{...ref("bitrates",t.id,"equipment_id",`${s.name} · encoder titular`),kind:"equip",prefer:"Encoder"}}:{}),
        ...(r?{res:ref("bitrates",r.id,"mbps",`${s.name} · reserva`),encR:{...ref("bitrates",r.id,"equipment_id",`${s.name} · encoder reserva`),kind:"equip",prefer:"Encoder"}}:{})}}});
  const oldRows=old.map(o=>{const s=svc[o.service_id],t=tit.find(x=>x.service_id===o.service_id);

let V=null;
function cell(c,r,gs){
  const v=r[c[1]],o=c[3]||{},rf=editing&&r._ref&&r._ref[c[1]];
  const cls=[gs?"gs":"",o.stickR?"stick-r":""].join(" ").trim();
  const ed=rf?` class="ed ${["num","br","pid"].includes(c[2])?"num":""} ${c[2]==="br"?"r":""} ${cls}" data-ref='${esc(JSON.stringify(rf))}' tabindex="0" title="Clique para editar"`:"";
  const C=x=>`class="${x} ${cls}"`;
  const nameRf=editing&&r._ref&&r._ref[c[1]];
  if((c[2]==="svc"||c[2]==="svcid")&&nameRf)return `<td class="ed nm ${cls}" data-ref='${esc(JSON.stringify(nameRf))}' data-val="${esc(v)}" tabindex="0" title="Clique para mudar o nome"><span class="svc"><span class="dot" style="background:${col(v)}"></span><span>${esc(v)} <span class="pen" aria-hidden="true">✎</span>${c[2]==="svcid"&&r.id!=null?`<small>ID ${r.id}</small>`:""}</span></span></td>`;
  if(c[2]==="svc")return `<td ${C("")}>${svcCell(v)}</td>`;
  if(c[2]==="svcid")return `<td ${C("")}><span class="svc"><span class="dot" style="background:${col(v)}"></span><span>${esc(v)}${r.id!=null?`<small>ID ${r.id}</small>`:""}</span></span></td>`;
  if(c[2]==="delta")return `<td ${C("num r")}>${v==null?"—":`<span class="dl ${v>0?"up":v<0?"down":"eq"}">${v>0?"▲ +":v<0?"▼ ":""}${nf.format(v)}</span>`}</td>`;
  if(c[2]==="sys")return `<td ${C("")}><span class="chip ${v==="ISDB-T"?"c-acc":"c-ok"}">${v}</span></td>`;
  if(c[2]==="layer")return `<td ${C("")}><span class="chip ${v==="B"?"c-acc":v==="A"?"c-ok":"c-warn"}">${v==="Tabelas"?v:"Layer "+v}</span></td>`;
  if(c[2]==="br"){
    if(rf)return `<td${ed}>${fmt(v)}</td>`;
    const flag=r.note?' <span class="chip c-warn" title="'+esc(r.note)+'">!</span>':"";
    if(!o.bar||v==null)return `<td ${C("num r")}>${fmt(v)}${flag}</td>`;
    const p=v/o.bar*100;
    return `<td ${C("num r")}><span class="brv"><span class="mt" title="${nf.format(+p.toFixed(1))}% da capacidade"><i style="width:${Math.min(100,p)}%;background:${col(r.svc||r.grp||"")}"></i></span><span class="pc">${nf.format(+p.toFixed(1))}%</span><span>${fmt(v)}</span>${flag}</span></td>`;
  }
  if(c[2]==="equip"){
    const e=v!=null?eqMap()[v]:null;
    const body=e?`<span class="eq">${esc(e.name)}</span>${e.manufacturer||e.model?`<small class="eqm">${esc([e.manufacturer,e.model].filter(Boolean).join(" · "))}</small>`:""}`:null;
    if(rf)return `<td class="ed equip ${cls}" data-ref='${esc(JSON.stringify(rf))}' tabindex="0" title="Clique para escolher o equipamento">${body||'<span class="ph">+ escolher</span>'}</td>`;
    return `<td ${C("equip"+(e?"":" nil"))}>${body||"—"}</td>`;
  }
  if(c[2]==="del")return `<td ${C("r")}><button type="button" class="btn sm danger" data-delrows='${esc(JSON.stringify({rows:r._del,name:r._name||""}))}'>Excluir</button></td>`;
  if(c[2]==="delsvc")return `<td ${C("r")}><button type="button" class="btn sm danger" data-delsvc="${v}" data-name="${esc(r.name)}">Excluir</button></td>`;
  if(c[2]==="where")return `<td ${C("")}>${r._where.length?r._where.map(w=>`<span class="chip c-acc">${w}</span>`).join(" "):'<span class="chip c-warn">nenhuma</span>'}</td>`;
  if(c[2]==="act")return `<td ${C("r")}><button type="button" class="btn sm danger" data-del="${v}">Excluir</button></td>`;
  if(c[2]==="uso")return `<td ${C("")}>${v?`<span class="chip c-acc" title="${esc(r._uses.join(", "))}">${v} ${v>1?"usos":"uso"}</span>`:'<span class="chip c-warn">sem uso</span>'}</td>`;
  if(["ename","func","txt"].includes(c[2])&&rf)return `<td class="ed tx ${cls}" data-ref='${esc(JSON.stringify(rf))}' data-val="${esc(v??"")}" tabindex="0" title="Clique para editar">${v?esc(v):'<span class="ph">+ informar</span>'}</td>`;
  if(c[2]==="ename")return `<td ${C("")}><b>${esc(v)}</b></td>`;
  if(c[2]==="func")return `<td ${C(v?"":"nil")}>${v?`<span class="chip c-ok">${esc(v)}</span>`:"—"}</td>`;
  if(c[2]==="pid")return rf?`<td${ed}>${v??"—"}</td>`:`<td ${C("num"+(v==null?" nil":""))}>${v??"—"}</td>`;
  if(c[2]==="num")return rf?`<td${ed}>${fmt(v)}</td>`:`<td ${C("num"+(v==null?" nil":""))}>${fmt(v)}</td>`;
  return `<td ${C("")}>${esc(fmt(v))}</td>`;
}

  $("tables").innerHTML=V.tables.map((t0,ti)=>{
    const hasDel=canEdit&&t0.rows.some(r=>r._del);
    const t=hasDel?{...t0,cols:[...t0.cols,["","_del","del"]],groups:t0.groups?[...t0.groups,["",1]]:null}:t0;
    const key=view+ti,s=sorts[key];let rows=t.rows;tot+=rows.length;
    if(q)rows=rows.filter(r=>Object.entries(r).some(([k,v])=>k!=="_ref"&&k!=="_uses"&&v!=null&&String(v).toLowerCase().includes(q)));
    if(s)rows=[...rows].sort((a,b)=>{const x=a[s.k],y=b[s.k];if(x==null)return 1;if(y==null)return -1;const d=typeof x==="number"?x-y:String(x).localeCompare(String(y),"pt");return s.asc?d:-d});
    shown+=rows.length;
    // início de cada grupo recebe divisória vertical
    const starts=new Set();if(t.groups){let i=0;for(const [,n] of t.groups){if(i>0)starts.add(i);i+=n}}
    const groups=t.groups?`<tr class="groups">${t.groups.map(([g,n],i)=>`<th colspan="${n}" class="${i===t.groups.length-1&&t.cols.at(-1)[3]?.stickR?"stick-r":""}">${g}</th>`).join("")}</tr>`:"";
    const foot=t.foot&&rows.length?`<tfoot><tr>${t.cols.map((c,i)=>{const cl=[starts.has(i)?"gs":"",c[3]?.stickR?"stick-r":""].join(" ");return c[2]==="br"?`<td class="num r ${cl}">${nf.format(sumBy(rows,c[1]))}</td>`:i===0?`<td class="${cl}">Total</td>`:`<td class="${cl}"></td>`}).join("")}</tr></tfoot>`:"";
    return `${t.h?`<h2>${t.h}</h2>`:""}${canEdit&&t.add?t.add():""}<div class="tablebox"><table class="${t.groups?"grouped":""}"><thead>${groups}<tr class="cols">${t.cols.map((c,i)=>`<th class="${["br","delta"].includes(c[2])?"r":""} ${starts.has(i)?"gs":""} ${c[3]?.stickR?"stick-r":""}"><button data-t="${ti}" data-k="${c[1]}">${c[0]}${s&&s.k===c[1]?`<span class="arw">${s.asc?" ▲":" ▼"}</span>`:""}</button></th>`).join("")}</tr></thead>
    <tbody>${rows.length?rows.map(r=>`<tr>${t.cols.map((c,i)=>cell(c,r,starts.has(i))).join("")}</tr>`).join(""):`<tr><td colspan="${t.cols.length}" class="empty">${q?"Nada encontrado para essa busca.":"Nenhum registro ainda."}</td></tr>`}</tbody>${foot}</table></div>`;
  }).join("");
  $("count").textContent=q?`${shown} de ${tot} linhas`:`${tot} linhas`;
}
function render(keepSearch){
  const all=views(build());V=all[view];
  const q=keepSearch&&$("q")?$("q").value:"";
  $("tabs").innerHTML=Object.entries(all).map(([k,v])=>`<button class="tab${k===view?" on":""}" role="tab" aria-selected="${k===view}" data-v="${k}">${v.tab}</button>`).join("");
  $("app").innerHTML=`<section class="hero"><span class="eyebrow">${V.eyebrow}</span><h1>${V.title}</h1><p class="lede">${V.lede}</p></section>
    <section class="cards">${V.cards}</section>${V.usage}
    <div class="tools"><input id="q" type="search" placeholder="Buscar serviço, PID ou valor…" aria-label="Buscar">${V.extra||""}<span class="count" id="count"></span></div>
    ${editing?'<p class="editbar"><span class="chip c-warn">Modo edição</span><span>Clique num valor sublinhado, num nome com ✎, em <b>+ informar</b> ou em <b>+ escolher</b>. Enter salva, Esc cancela, vazio apaga.</span></p>':""}
    ${V.form==="equip"?equipForm():V.form==="svc"?svcForm():""}
    <datalist id="codecs"><option value="MPEG 1"><option value="MPEG 2"><option value="MPEG 4"><option value="HEVC"><option value="AAC"></datalist>
    <datalist id="systems"><option value="DVB"><option value="ISDB-T"></datalist>
    <datalist id="svcnames">${D.services.map(s=>`<option value="${esc(s.name)}">`).join("")}</datalist>
    <datalist id="groups">${[...new Set(D.isdbPids.map(p=>p.grp))].map(g=>`<option value="${esc(g)}">`).join("")}</datalist>
    <datalist id="idents">${[...new Set(["VIDEO","AUDIO","PMT","PCR","CC",...D.isdbPids.map(p=>p.ident)].filter(Boolean))].map(g=>`<option value="${esc(g)}">`).join("")}</datalist>
    <datalist id="functions">${[...new Set(["Encoder","Multiplexador","Modulador","Transcoder","Receptor IRD","Gerador de tabelas",...D.equipment.map(e=>e.function)].filter(Boolean))].map(e=>`<option value="${esc(e)}">`).join("")}</datalist>
    <datalist id="makers">${[...new Set(D.equipment.map(e=>e.manufacturer).filter(Boolean))].sort().map(e=>`<option value="${esc(e)}">`).join("")}</datalist><div id="tables"></div><div class="notes">${V.notes.map(([n,f])=>`<p class="${f?"flag":""}">${esc(n)}</p>`).join("")}</div>`;
  $("q").value=q;renderTables();
}

/* ===== Edição ===== */
async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{"Content-Type":"application/json",...(opts.token?{Authorization:"Bearer "+opts.token}:{})}});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||"Falha na requisição."),{status:r.status});return j;
}
function applyLocal(rf,value){
  const map={equipment:["equipment","id"],settings:["settings","key"],bitrates:["bitrates","id"],service_pids:["pids","service_id"],encoder_rates:["encoder","id"],isdb_layers:["layers","id"],isdb_pids:["isdbPids","id"]};
  const [arr,pk]=map[rf.t];const row=D[arr].find(x=>String(x[pk])===String(rf.id));if(row)row[rf.t==="settings"?"value":rf.f]=value;
}
function startEdit(el){
  if(el.querySelector("input,select"))return;
  const rf=JSON.parse(el.dataset.ref);
  if(rf.kind==="equip")return startSelect(el,rf);
  const isText=rf.kind==="text";
  const old=el.querySelector(".ph")?"—":el.textContent.trim(),oldHtml=el.innerHTML;
  const start=el.dataset.val!=null?el.dataset.val:old==="—"?"":isText?old:old.replace(/\./g,"");
  el.innerHTML=isText?`<input class="cell text" ${rf.list?`list="${rf.list}"`:""} value="${esc(start)}" aria-label="Novo valor">`:`<input class="cell" inputmode="decimal" value="${esc(start)}" aria-label="Novo valor">`;
  const inp=el.querySelector("input");inp.focus();inp.select();
  let done=false;
  const finish=async save=>{if(done)return;done=true;
    if(!save||inp.value.trim()===start){el.innerHTML=oldHtml;return}
    try{const r=await api(`/api/${rf.t}/${encodeURIComponent(rf.id)}`,{method:"PATCH",token:getToken(),body:JSON.stringify({field:rf.f,value:inp.value.trim(),context:rf.ctx})});
      if(rf.renameSvc||rf.t==="services"&&rf.f==="name"){await reload("Nome alterado em todas as abas");return}
      applyLocal(rf,r.value);toast("Valor salvo");
      auditLog=await api("/api/history").catch(()=>auditLog);render(true);
    }catch(e){el.innerHTML=oldHtml;toast(e.message,true);if(e.status===401){setToken("");setEditing(false)}}};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")finish(true);if(e.key==="Escape")finish(false)});
  inp.addEventListener("blur",()=>finish(true));
}
function eqMap(){return Object.fromEntries(D.equipment.map(e=>[e.id,e]))}
function eqLabel(id){const e=id!=null&&D.equipment.find(x=>x.id===id);return e?[e.name,e.manufacturer,e.model].filter(Boolean).join(" "):""}
function startSelect(el,rf){
  const oldHtml=el.innerHTML,cur=(()=>{const r=D.bitrates.find(b=>rf.t==="bitrates"&&b.id===rf.id)||D.encoder.find(e=>rf.t==="encoder_rates"&&e.id===rf.id)||D.layers.find(l=>rf.t==="isdb_layers"&&l.id===rf.id);return r?.equipment_id??""})();
  const opt=e=>`<option value="${e.id}" ${e.id===cur?"selected":""}>${esc([e.name,e.manufacturer,e.model].filter(Boolean).join(" · "))}</option>`;
  const pref=D.equipment.filter(e=>(e.function||"").toLowerCase().startsWith((rf.prefer||"").toLowerCase().slice(0,5))),rest=D.equipment.filter(e=>!pref.includes(e));
  el.innerHTML=`<select class="cell text" aria-label="Equipamento"><option value="">— sem equipamento —</option>${pref.length?`<optgroup label="${esc(rf.prefer)}">${pref.map(opt).join("")}</optgroup>`:""}${rest.length?`<optgroup label="${pref.length?"Outros":"Equipamentos"}">${rest.map(opt).join("")}</optgroup>`:""}<option value="__new">+ Cadastrar novo equipamento…</option></select>`;
  const sel=el.querySelector("select");sel.focus();
  let done=false;
  const save=async()=>{if(done)return;done=true;
    if(sel.value==="__new"){view="equip";location.hash="equip";render();setTimeout(()=>$("eqName")?.focus(),50);return}
    const val=sel.value===""?null:+sel.value;if(val===(cur===""?null:cur)){el.innerHTML=oldHtml;return}
    try{const r=await api(`/api/${rf.t}/${rf.id}`,{method:"PATCH",token:getToken(),body:JSON.stringify({field:"equipment_id",value:val,context:rf.ctx})});
      applyLocal(rf,r.value);toast("Equipamento definido");auditLog=await api("/api/history").catch(()=>auditLog);render(true);
    }catch(e){el.innerHTML=oldHtml;toast(e.message,true);if(e.status===401){setToken("");setEditing(false)}}};
  sel.addEventListener("change",save);
  sel.addEventListener("keydown",e=>{if(e.key==="Escape"){done=true;el.innerHTML=oldHtml}});
  sel.addEventListener("blur",()=>{if(!done){done=true;el.innerHTML=oldHtml}});
}
function equipForm(){
  if(!canEdit)return "";
  return `<form class="eqform" id="eqForm" autocomplete="off">
    <h2>Cadastrar equipamento</h2>
    <div class="eqgrid">
      <label>Nome *<input id="eqName" name="name" required placeholder="Ex.: Encoder 01 HD"></label>
      <label>Fabricante<input id="eqMaker" name="manufacturer" list="makers" placeholder="Ex.: Ateme"></label>
      <label>Modelo<input id="eqModel" name="model" placeholder="Ex.: Titan Live"></label>
      <label>Função<input id="eqFunc" name="function" list="functions" placeholder="Encoder, Multiplexador…"></label>
      <label>Local<input id="eqLoc" name="location" placeholder="Ex.: Rack 3 · Sala técnica"></label>
      <label>Nº de série<input id="eqSerial" name="serial"></label>
      <label class="wide">Observação<input id="eqNotes" name="notes"></label>
    </div>
    <div class="eqactions"><button class="btn primary" type="submit">Cadastrar</button><span class="msg" id="eqMsg"></span></div>
  </form>`;
}
function svcPick(list){
  if(!list.length)return `<span class="empty-pick">Todos os serviços já estão nesta tabela. Cadastre um novo na aba <b>Serviços</b>.</span>`;
  return `<label class="grow">Serviço *<select name="service_id" required><option value="">Escolha…</option>${list.map(s=>`<option value="${s.id}">${esc(s.name)}${s.service_id!=null?` (ID ${s.service_id})`:""}</option>`).join("")}</select></label>`;
}
function mbpsIn(name,label){return `<label>${label}<input name="${name}" inputmode="decimal" placeholder="0,000"></label>`}
function addBar(key,title,fields){
  return `<form class="addbar" data-add="${key}" autocomplete="off"><span class="ttl">+ ${title}</span>${fields}${fields.includes("empty-pick")?"":`<button class="btn primary" type="submit">Incluir</button>`}<span class="msg"></span></form>`;
}
function svcForm(){
  if(!canEdit)return "";
  const opts=[["pids","Serviços & PIDs",1],["titular","DVB titular",1],["reserva","DVB reserva",1],["antigo","DVB antigo",0],["enc","Taxas encoder",0],["mux","Taxas mux",0],["isdb","ISDB-T (layer B)",0]];
  return `<form class="eqform" id="svcForm" autocomplete="off">
    <h2>Cadastrar serviço</h2>
    <div class="eqgrid">
      <label>Nome *<input id="svName" name="name" required placeholder="Ex.: CANAL 2.6"></label>
      <label>ID de serviço<input id="svId" name="service_id" inputmode="numeric" placeholder="Ex.: 59235"></label>
      <label>Codificação<input id="svCodec" name="codec" list="codecs" placeholder="MPEG 4"></label>
      <label>Sistema<select id="svSys" name="system"><option>DVB</option><option>ISDB-T</option></select></label>
      <div class="checks"><span style="font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);flex-basis:100%">Incluir nas abas</span>${opts.map(([v,l,on])=>`<label><input type="checkbox" name="include" value="${v}" ${on?"checked":""}>${l}</label>`).join("")}</div>
    </div>
    <div class="eqactions"><button class="btn primary" type="submit">Cadastrar serviço</button><span class="msg" id="svMsg"></span></div>
  </form>`;
}
async function reload(msg){D=await api("/api/data");auditLog=await api("/api/history").catch(()=>auditLog);if(msg)toast(msg);render(true)}
function authFail(err){toast(err.message,true);if(err.status===401){setToken("");setEditing(false)}}
async function postRow(table,body,ignoreDup){
  try{return await api(`/api/rows/${table}`,{method:"POST",token:getToken(),body:JSON.stringify(body)})}
  catch(e){if(ignoreDup&&e.status===409)return null;throw e}
}
const ADDERS={
  pids:async f=>{await postRow("service_pids",{service_id:f.service_id,context:"Serviços & PIDs"});await postRow("bitrates",{service_id:f.service_id,config:"pids_total",mbps:f.mbps},true)},
  dvb:async f=>{await postRow("bitrates",{service_id:f.service_id,config:"titular",mbps:f.tit,context:"DVB atual"},true);await postRow("bitrates",{service_id:f.service_id,config:"reserva",mbps:f.res,context:"DVB atual"},true)},
  old:async f=>{await postRow("bitrates",{service_id:f.service_id,config:"antigo",mbps:f.mbps,context:"DVB antigo"})},
  taxas:async f=>{await postRow("encoder_rates",{service_id:f.service_id,source:taxMode,context:"Taxas"})},
  layer:async f=>{await postRow("isdb_layers",{layer:f.layer,name:f.name,mbps:f.mbps,context:"ISDB-T layers"})},
  isdbpid:async f=>{await postRow("isdb_pids",{grp:f.grp,pid:f.pid,ident:f.ident,mbps:f.mbps,context:"ISDB-T PIDs"})},
};
function askLogin(){
  $("login").hidden=false;$("loginMsg").textContent="Digite a senha de edição para incluir, excluir ou alterar.";
  window.scrollTo({top:0,behavior:"smooth"});setTimeout(()=>$("token").focus(),300);
}
function setEditing(on){editing=on;$("editBtn").classList.toggle("on",on);$("editBtn").textContent=on?"Sair da edição":"Editar valores";render(true)}

/* ===== Eventos ===== */
$("tabs").addEventListener("click",async e=>{const b=e.target.closest(".tab");if(!b)return;view=b.dataset.v;if(view==="hist")auditLog=await api("/api/history").catch(()=>[]);location.hash=view;render()});
$("app").addEventListener("click",e=>{
  const m=e.target.closest("[data-m]");if(m){taxMode=m.dataset.m;render(true);return}
  const th=e.target.closest("th button");if(th){const key=view+th.dataset.t,s=sorts[key];sorts[key]={k:th.dataset.k,asc:s&&s.k===th.dataset.k?!s.asc:true};renderTables();return}
  if(e.target.closest("[data-delrows],[data-delsvc],[data-del]")&&!editing){askLogin();return}
  const arm=b=>{if(b.dataset.armed==="1")return true;b.dataset.armed="1";b.textContent="Confirmar exclusão";setTimeout(()=>{if(b.isConnected){b.dataset.armed="";b.textContent="Excluir"}},4000);return false};
  const dr=e.target.closest("[data-delrows]");if(dr){if(!arm(dr))return;const {rows,name}=JSON.parse(dr.dataset.delrows);
    (async()=>{try{for(const [t,id] of rows)await api(`/api/rows/${t}/${encodeURIComponent(id)}?context=${encodeURIComponent((V.tab||"")+" · "+name)}`,{method:"DELETE",token:getToken()});await reload("Linha excluída")}catch(err){authFail(err);reload()}})();return}
  const ds=e.target.closest("[data-delsvc]");if(ds){if(!arm(ds))return;
    api(`/api/services/${ds.dataset.delsvc}`,{method:"DELETE",token:getToken()}).then(()=>reload(`${ds.dataset.name} excluído`)).catch(authFail);return}
  const del=e.target.closest("[data-del]");if(del){
    if(del.dataset.armed!=="1"){del.dataset.armed="1";del.textContent="Confirmar exclusão";setTimeout(()=>{if(del.isConnected){del.dataset.armed="";del.textContent="Excluir"}},4000);return}
    api(`/api/equipment/${del.dataset.del}`,{method:"DELETE",token:getToken()}).then(()=>{const id=+del.dataset.del;D.equipment=D.equipment.filter(x=>x.id!==id);
      for(const b of D.bitrates)if(b.equipment_id===id)b.equipment_id=null;for(const x of D.encoder)if(x.equipment_id===id)x.equipment_id=null;for(const x of D.layers)if(x.equipment_id===id)x.equipment_id=null;toast("Equipamento excluído");render(true)})
      .catch(err=>{toast(err.message,true);if(err.status===401){setToken("");setEditing(false)}});return}
  const ed=e.target.closest("td.ed,.edv");if(ed)startEdit(ed);
});
$("app").addEventListener("submit",async e=>{
  if(!editing&&(e.target.closest("form[data-add]")||["svcForm","eqForm"].includes(e.target.id))){e.preventDefault();askLogin();return}
  const ab=e.target.closest("form[data-add]");
  if(ab){e.preventDefault();const f=Object.fromEntries(new FormData(ab).entries()),msg=ab.querySelector(".msg");msg.textContent="";
    try{await ADDERS[ab.dataset.add](f);await reload("Linha incluída")}catch(err){msg.textContent=err.message;if(err.status===401){setToken("");setEditing(false)}}return}
  if(e.target.id==="svcForm"){e.preventDefault();const fd=new FormData(e.target),body=Object.fromEntries(fd.entries());body.include=fd.getAll("include");$("svMsg").textContent="";
    try{const sv=await api("/api/services",{method:"POST",token:getToken(),body:JSON.stringify(body)});await reload(`${sv.name} cadastrado`);$("svName")?.focus()}
    catch(err){$("svMsg").textContent=err.message;if(err.status===401){setToken("");setEditing(false)}}return}
  if(e.target.id!=="eqForm")return;e.preventDefault();
  const f=e.target,body=Object.fromEntries(new FormData(f).entries());$("eqMsg").textContent="";
  try{const eq=await api("/api/equipment",{method:"POST",token:getToken(),body:JSON.stringify(body)});D.equipment.push(eq);D.equipment.sort((a,b)=>a.name.localeCompare(b.name,"pt"));
    toast(`${eq.name} cadastrado`);render(true);$("eqName")?.focus()}
  catch(err){$("eqMsg").textContent=err.message;if(err.status===401){setToken("");setEditing(false)}}});
$("app").addEventListener("keydown",e=>{const ed=e.target.closest&&e.target.closest("td.ed");if(ed&&e.key==="Enter"&&e.target===ed){e.preventDefault();startEdit(ed)}});
$("app").addEventListener("input",e=>{if(e.target.id==="q")renderTables()});
$("editBtn").addEventListener("click",async()=>{
  if(editing)return setEditing(false);
  if(getToken()){try{await api("/api/auth/check",{method:"POST",token:getToken()});return setEditing(true)}catch{setToken("")}}
  $("login").hidden=false;$("token").focus();
});
$("login").addEventListener("submit",async e=>{e.preventDefault();$("loginMsg").textContent="";
  const tk=$("token").value.trim();
  try{await api("/api/auth/check",{method:"POST",token:tk});setToken(tk);$("token").value="";$("login").hidden=true;setEditing(true)}
  catch(err){$("loginMsg").textContent=err.message}});
$("loginCancel").addEventListener("click",()=>{$("login").hidden=true;$("loginMsg").textContent=""});
$("themeBtn").addEventListener("click",()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark"});

(async()=>{
  try{D=await api("/api/data");canEdit=D.editable;$("editBtn").hidden=!canEdit;
    const h=location.hash.slice(1);if(["pids","dvb","old","taxas","isdb","svcs","equip","hist"].includes(h))view=h;
    if(view==="hist")auditLog=await api("/api/history").catch(()=>[]);
    render();
  }catch(e){$("app").innerHTML=`<p class="state">Não foi possível carregar os dados do banco. ${esc(e.message)}</p>`}
})();
</script>
