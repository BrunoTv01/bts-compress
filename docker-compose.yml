# BTS Compress com PostgreSQL. Não precisa configurar nada:
#   docker compose up -d
#   docker compose logs app | grep "Senha inicial"     (senha do usuário admin)
# Abra http://IP-DO-SERVIDOR:3000
#
# Opcional: crie um arquivo .env (veja .env.example) para escolher a senha inicial ou a porta.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bts
      POSTGRES_USER: bts
      # o banco não fica exposto fora do Docker; só o sistema fala com ele
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bts-rede-interna}
    volumes:
      - bts-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bts -d bts"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bts:${DB_PASSWORD:-bts-rede-interna}@db:5432/bts
      # vazio = o sistema gera uma senha para o admin e mostra no log
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  bts-db:
