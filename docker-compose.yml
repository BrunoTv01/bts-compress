# BTS Compress com PostgreSQL.
#   1. cp .env.example .env   e troque as senhas
#   2. docker compose up -d
#   3. abra http://IP-DO-SERVIDOR:3000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bts
      POSTGRES_USER: bts
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - bts-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bts -d bts"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bts:${DB_PASSWORD}@db:5432/bts
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Defina ADMIN_TOKEN no arquivo .env}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  bts-db:
