services:
  - type: web
    name: bts-compress
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: bts-compress-db
          property: connectionString
      - key: ADMIN_TOKEN
        sync: false   # senha definida manualmente no painel do Render

databases:
  - name: bts-compress-db
    plan: free
    region: ohio
    databaseName: bts
    user: bts
